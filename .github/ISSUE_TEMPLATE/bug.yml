name: Bug report
description: Something in the app or the repo doesn't work as the spec says it should.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security issues go through SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened. Link the spec section or story if you know it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Page URL, or file and commit for repo issues.
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: e.g. Pixel 8, Chrome 142, dark theme
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, logs, how often it happens.
